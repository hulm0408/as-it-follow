services:
  - type: worker
    name: toing-swiggy-bot
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: BOSS_ID
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: PERSISTENCE_SECRET
        sync: false
      - key: HEADLESS
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
